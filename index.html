<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE:AD</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-wrapper">
    <!-- Header -->
    <div class="header-bar" id="main-header">
        <div class="header-title">
            <span id="header-step">Фрагмент 1</span>
            <span class="badge" id="header-badge">Чтение</span>
        </div>
        
        <div class="error-counter" id="error-counter-box">
            Ошибки: <span id="error-count">0</span>/2
        </div>

        <div class="progress-pips" id="pips-container"></div>
    </div>

    <!-- Screen 1: Auth -->
    <div class="screen visible" id="screen-auth">
        <div class="logo-text">RE:AD</div>
        <p class="subtitle">Платформа осмысленного чтения</p>

        <div class="input-group">
            <label for="input-fio">ФИО студента</label>
            <input type="text" id="input-fio" placeholder="Иванов Иван Иванович">
        </div>

        <div class="input-group">
            <label id="topic-name-label">Тема:</label>
            <input type="file" id="file-input" accept=".xml" class="hidden-file">
            <button class="btn btn-secondary" id="btn-choose-file" type="button">
                <span id="file-btn-text">Выбрать XML файл</span>
            </button>
            <div class="file-status" id="file-status">Файл не выбран</div>
        </div>

        <button class="btn" id="btn-start" type="button" disabled>Начать чтение</button>
        <!-- кнопка для пропуска чтения -->
        <button class="btn btn-secondary" id="btn-skip" type="button" disabled>Сдать финальный тест без чтения</button>
        <button class="btn btn-secondary" id="btn-teacher" type="button" disabled>Для преподавателя</button>
    </div>

    <!-- Screen 2: Process -->
    <div class="screen" id="screen-process">
        <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
        <div class="content-box" id="content-area">Загрузка...</div>
        <div id="controls-area"></div>
    </div>

    <!-- Screen 3: Results -->
    <div class="screen" id="screen-result">
        <div class="result-header">
            <div class="grade-circle" id="final-grade-val">5</div>
            <h1 class="final-fio" id="final-fio">ФИО</h1>
            <p class="result-subtitle">Тест завершен</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="stat-time">0с</div>
                <div class="stat-label">Время</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-errors">0</div>
                <div class="stat-label">Ошибок</div>
            </div>
        </div>

        <h3 class="section-title">Результаты финального теста</h3>
        <table id="results-table">
            <thead><tr><th>Вопрос</th><th>Ответ</th><th>Статус</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
