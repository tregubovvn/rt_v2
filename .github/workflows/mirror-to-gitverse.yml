name: Mirror to GitVerse

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  delete:
    branches: [ "**" ]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to GitVerse
        uses: lissy93/repo-mirror-action@v1
        with:
          # Обязательный параметр, которого не хватало
          ssh_key: ${{ secrets.GITVERSE_SSH_KEY }}
          # URL репозитория-зеркала на GitVerse
          # Замените ваш_логин на ваш реальный логин
          target_repo_url: 'ssh://git@gitverse.ru:2222/ваш_логин/rt_v2.git'

